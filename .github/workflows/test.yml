name: Test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

# A run is only interesting for the tip of a branch; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # `make test` downloads an embedded Postgres archive on first run, which
    # setup-go's module cache does not cover.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      # The UI is on Yarn 4, which is not published to npm; corepack reads the
      # version from packageManager in ui/package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.35.0 && corepack enable

      - name: Install
        working-directory: ui
        run: yarn install --immutable

      - name: Test
        working-directory: ui
        run: yarn test
  # govulncheck is reachability-aware: it reports only advisories whose
  # vulnerable symbols are actually called from this code, which is the
  # difference between a list of advisories and a list of problems. It needs
  # the generated embeds to load packages, hence `make swagger` first.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Deliberately not go-version-file here. go.mod still declares go 1.25.4
      # while the image builds on golang:1.26.4, so scanning with the directive
      # reports standard library advisories (GO-2026-5856 in crypto/tls,
      # GO-2026-5039 in net/textproto) that are not present in the binary that
      # actually ships. Scan what ships. Keep this in step with the Dockerfile;
      # #1020 moves both to 1.26.5.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Generate embeds
        run: |
          make swagger
          # go:embed ignores dotfiles, so a .keep here would still fail with
          # "contains no embeddable files". The UI bundle itself is irrelevant
          # to a vulnerability scan; only a loadable package tree is needed.
          mkdir -p internal/web/dist && touch internal/web/dist/index.html

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
