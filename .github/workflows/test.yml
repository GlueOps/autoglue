name: Test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

# A run is only interesting for the tip of a branch; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # `make test` downloads an embedded Postgres archive on first run, which
    # setup-go's module cache does not cover.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      # The UI is on Yarn 4, which is not published to npm; corepack reads the
      # version from packageManager in ui/package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.35.0 && corepack enable

      - name: Install
        working-directory: ui
        run: yarn install --immutable

      - name: Test
        working-directory: ui
        run: yarn test
