name: Test

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

# A run is only interesting for the tip of a branch; cancel superseded ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # `make test` downloads an embedded Postgres archive on first run, which
    # setup-go's module cache does not cover.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # The UI is on Yarn 4, which is not published to npm; corepack reads the
      # version from packageManager in ui/package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.35.0 && corepack enable

      - name: Install
        working-directory: ui
        run: yarn install --immutable

      - name: Test
        working-directory: ui
        run: yarn test

  # Nothing ran eslint on a PR before this job, which is how TypeScript 7
  # (#1057) merged green and still broke linting outright — typescript-eslint
  # refuses TS >= 6.1, and it had to be reverted in #1061. The build and the
  # tests do not exercise the linter, so a toolchain change can pass both while
  # leaving `yarn lint` unrunnable.
  #
  # No SDK generation step here on purpose: eslint.config.js uses
  # tseslint.configs.recommended, not the type-checked variant, so this does
  # not resolve types and does not need docs/openapi.json or ui/src/sdk.
  lint-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      # The UI is on Yarn 4, which is not published to npm; corepack reads the
      # version from packageManager in ui/package.json.
      - name: Enable corepack
        run: npm i -g corepack@0.35.0 && corepack enable

      - name: Install
        working-directory: ui
        run: yarn install --immutable

      - name: Lint
        working-directory: ui
        run: yarn lint

  # govulncheck is reachability-aware: it reports only advisories whose
  # vulnerable symbols are actually called from this code, which is the
  # difference between a list of advisories and a list of problems. It needs
  # the generated embeds to load packages, hence `make swagger` first.
  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Deliberately not go-version-file here. go.mod still declares go 1.25.4
      # while the image builds on a newer toolchain, so scanning with the
      # directive reports standard library advisories that are not present in
      # the binary that actually ships. Scan what ships.
      #
      # This must match the builder image in the Dockerfile exactly. When they
      # drift, the scan is either reporting vulnerabilities the shipped binary
      # does not have or, worse, missing ones it does.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Generate embeds
        run: |
          make swagger
          # go:embed ignores dotfiles, so a .keep here would still fail with
          # "contains no embeddable files". The UI bundle itself is irrelevant
          # to a vulnerability scan; only a loadable package tree is needed.
          mkdir -p internal/web/dist && touch internal/web/dist/index.html

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
