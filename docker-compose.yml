services:
  postgres:
    build:
      context: postgres
    env_file: .env
    environment:
      POSTGRES_USER: $DB_USER
      POSTGRES_PASSWORD: $DB_PASSWORD
      POSTGRES_DB: $DB_NAME
    expose:
      - 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  # The API and the worker are separate processes off the same image. `serve`
  # only enqueues jobs; nothing runs them unless `worker` is up.
  #
  # These are opt-in so `docker compose up -d` stays a database-only bring-up
  # for the `go run . serve` + `go run . worker` local flow:
  #   docker compose --profile app up -d
  api:
    profiles: ["app"]
    build:
      context: .
    env_file: .env
    command: ["serve"]
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  worker:
    profiles: ["app"]
    build:
      context: .
    env_file: .env
    command: ["worker"]
    depends_on:
      - postgres
    healthcheck:
      disable: true

  mailpit:
    image: axllent/mailpit@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
